<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Reporting</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --text: #1d1c1a; --muted: #6b6862; --border: #e2dfd8;
  --accent: #b5651d; --accent-soft: #f3e4d5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #201f1c; --text: #ece9e2; --muted: #a29e95; --border: #34322d;
    --accent: #e0954f; --accent-soft: #3a2c1e;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #201f1c; --text: #ece9e2; --muted: #a29e95; --border: #34322d;
  --accent: #e0954f; --accent-soft: #3a2c1e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
nav { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 20px; padding: 10px 16px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
nav h1 { font-size: 16px; margin: 0 8px 9px 0; }
.tabs { display: flex; gap: 2px; }
.tabs a { display: block; padding: 8px 16px; color: var(--muted); text-decoration: none; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-selected="true"] { color: var(--text); font-weight: 600; background: var(--bg); border-color: var(--border); box-shadow: inset 0 3px 0 var(--accent); }
main { flex: 1; min-height: 0; }
iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
.hidden { display: none !important; }
</style>
</head>
<body>
<nav>
  <h1>Dune Reporting</h1>
  <div class="tabs" role="tablist">
    <a href="#drop-rates" role="tab" data-page="drop-rates.html" title="Drop rates per dungeon and level, from session exports">Drop rates</a>
    <a href="#permits" role="tab" data-page="permits.html" title="Crafting permits held per grade across your characters, from augments and uniques exports">Permits</a>
  </div>
</nav>
<main id="frames"></main>
<script>
(() => {
  // Each page loads in its own frame the first time its tab is opened, then stays loaded so switching
  // tabs keeps its state. The open tab is kept in the URL hash (and remembered for the next visit).
  const tabs = [...document.querySelectorAll('.tabs a')];
  const frames = new Map();
  const LS_TAB = 'dune-home:tab';
  const remembered = () => { try { return localStorage.getItem(LS_TAB); } catch { return null; } };

  function show(hash) {
    const tab = tabs.find(t => t.hash === hash) || tabs.find(t => t.hash === remembered()) || tabs[0];
    for (const t of tabs) t.setAttribute('aria-selected', String(t === tab));
    if (!frames.has(tab.hash)) {
      const frame = document.createElement('iframe');
      frame.src = tab.dataset.page;
      frame.title = tab.textContent;
      document.getElementById('frames').appendChild(frame);
      frames.set(tab.hash, frame);
    }
    for (const [key, frame] of frames) frame.classList.toggle('hidden', key !== tab.hash);
    document.title = `${tab.textContent} · Dune Reporting`;
    try { localStorage.setItem(LS_TAB, tab.hash); } catch {}
    if (location.hash !== tab.hash) history.replaceState(null, '', tab.hash);
  }

  window.addEventListener('hashchange', () => show(location.hash));
  show(location.hash);
})();
</script>
</body>
</html>
